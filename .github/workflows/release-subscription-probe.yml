name: Release subscription probe APK
on:
  workflow_dispatch:
  push:
    branches: ["probe/subscription-native"]
    paths: [".github/workflows/release-subscription-probe.yml"]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait for exact source build and download APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            RUN_ID=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=20" --jq '.workflow_runs[] | select(.path == ".github/workflows/subscription-probe.yml" and .event == "push") | .id' | head -n 1)
            if test -n "$RUN_ID"; then break; fi
            sleep 5
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --exit-status
          test "$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .head_sha)" = "$GITHUB_SHA"
          gh run download "$RUN_ID" --name moling-subscription-probe-debug --dir apk
          test -f apk/app-debug.apk
          mv apk/app-debug.apk apk/Moling-AI-Paper-v0.3.0.apk
          cd apk
          sha256sum Moling-AI-Paper-v0.3.0.apk > SHA256SUMS.txt
      - name: Publish diagnostics prerelease
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          墨灵 AI Paper v0.3.0：完善订阅模型选择与实际调用链路。
          账号动态模型列表，展示名称和ID，独立选择文字回答模型、图片/手写/PDF模型，支持图片沿用文字模型。
          设置页显示已保存模型、当前通道、候选测试状态；提供真实文字和图片转写测试。未验证图片能力不伪称支持。
          主界面、本机识别失败的订阅转写和PDF统一读取选择；可勾选直接图片识别跳过本机等待。
          模型列表与请求前统一处理令牌临期刷新；退出清除会话、列表和测试状态；保留应用级授权与安全阶段日志。
          图片转写后进入原指令/历史/回答流程。新增生产设置页模型选择/恢复的Robolectric测试及跨模型请求契约测试。
          凭据仍仅在内存，进程结束后重新登录；不会静默跨模型或计费接口降级。PDF设备端行为仍需真机验证。
          NOTES
          printf '\nSource: %s\n' "$GITHUB_SHA" >> release-notes.md
          gh release create v0.3.0-ai-paper \
            apk/Moling-AI-Paper-v0.3.0.apk apk/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --title "Moling AI Paper v0.3.0" --notes-file release-notes.md
