name: Release subscription probe APK
on:
  workflow_dispatch:
  push:
    branches: ["probe/subscription-native"]
    paths: [".github/workflows/release-subscription-probe.yml"]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait for exact source build and download APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            RUN_ID=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=20" --jq '.workflow_runs[] | select(.path == ".github/workflows/subscription-probe.yml" and .event == "push") | .id' | head -n 1)
            if test -n "$RUN_ID"; then break; fi
            sleep 5
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --exit-status
          test "$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .head_sha)" = "$GITHUB_SHA"
          gh run download "$RUN_ID" --name moling-subscription-probe-debug --dir apk
          test -f apk/app-debug.apk
          mv apk/app-debug.apk apk/Moling-AI-Paper-v0.2.4.apk
          cd apk
          sha256sum Moling-AI-Paper-v0.2.4.apk > SHA256SUMS.txt
      - name: Publish diagnostics prerelease
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          墨灵 AI Paper v0.2.4：接通无本机识别环境下的订阅手写转写。
          本地 ML Kit 识别优先；失败且选中 ChatGPT 订阅时，将当前笔迹 PNG 交给所选模型转写，再走原指令、误触判断、历史与回答流程。
          使用订阅视觉识别时，正常提问包含一次转写请求和一次回答请求，均消耗订阅额度。不自动切换其他计费接口。
          请登录、刷新模型列表、使用所选模型，然后返回主界面书写；无需自建识别服务。原 API 的识别服务入口保留。
          沿用 v0.2.3 授权生命周期修复与阶段日志。令牌仅在内存；独立包名，与旧版共存。
          设备端手写转写与回答仍需实机确认。所选模型必须具备图片输入能力。
          NOTES
          printf '\nSource: %s\n' "$GITHUB_SHA" >> release-notes.md
          gh release create v0.2.4-ai-paper \
            apk/Moling-AI-Paper-v0.2.4.apk apk/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --title "Moling AI Paper v0.2.4" --notes-file release-notes.md
