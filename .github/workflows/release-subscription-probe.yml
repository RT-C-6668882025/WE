name: Release subscription probe APK
on:
  workflow_dispatch:
  push:
    branches: ["probe/subscription-native"]
    paths: [".github/workflows/release-subscription-probe.yml"]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait for exact source build and download APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            RUN_ID=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=20" --jq '.workflow_runs[] | select(.path == ".github/workflows/subscription-probe.yml" and .event == "push") | .id' | head -n 1)
            if test -n "$RUN_ID"; then break; fi
            sleep 5
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --exit-status
          test "$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .head_sha)" = "$GITHUB_SHA"
          gh run download "$RUN_ID" --name moling-subscription-probe-debug --dir apk
          test -f apk/app-debug.apk
          mv apk/app-debug.apk apk/Moling-AI-Paper-v0.2.2.apk
          cd apk
          sha256sum Moling-AI-Paper-v0.2.2.apk > SHA256SUMS.txt
      - name: Publish diagnostics prerelease
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          墨灵 AI Paper v0.2.2：官方订阅 ModelProvider + 本地 PDF 练习工作区。
          设置 → ChatGPT 登录与模型选择 → 登录 → 使用所选模型 → 返回墨灵书写提问。
          支持 ModelProvider 切换，保留原 Anthropic 兼容 API、手写识别和历史；不自动跨通道计费。
          令牌仅存内存，进程退出后重新登录；订阅请求携带最近六轮本地历史。
          设置 → PDF 练习工作区 → 导入本地 PDF；无选区提交整页，有选区提交矩形区域。
          首版 100MB 文件上限；原 PDF、笔迹、提交快照和结果分别存储，PDF/触控仍需平板实机验证。
          当前为可回退集成版，与旧版本共存；本地 PDF 导入、翻页/缩放、独立矢量笔迹、矩形选区、手动图片批改及结果记录已接入；Drive/Room、Agent 尚未接入。
          构建与单测通过后由工作流发布；需真机确认主界面手写应答。
          NOTES
          printf '\nSource: %s\n' "$GITHUB_SHA" >> release-notes.md
          gh release create v0.2.2-ai-paper \
            apk/Moling-AI-Paper-v0.2.2.apk apk/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --title "Moling AI Paper v0.2.2" --notes-file release-notes.md
