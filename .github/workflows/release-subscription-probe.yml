name: Release subscription probe APK
on:
  workflow_dispatch:
  push:
    branches: ["probe/subscription-native"]
    paths: [".github/workflows/release-subscription-probe.yml"]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify tested source and download existing APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/40693423075 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/40693423075 --jq .head_sha)" = 35906bc16f81008e71405935c75b6fb26ce7dac0
          gh run download 40693423075 --name moling-subscription-probe-debug --dir apk
          test -f apk/app-debug.apk
          mv apk/app-debug.apk apk/Moling-Subscription-Probe-v0.1.0.apk
          cd apk
          sha256sum Moling-Subscription-Probe-v0.1.0.apk > SHA256SUMS.txt
      - name: Publish prerelease with direct APK asset
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Android 订阅最小验证版，独立包名，可与正式墨灵共存。
          下载 APK 后直接安装，打开「Moling 订阅验证」，依次测试登录、模型列表、文本和图片请求。
          已通过单测、lint、debug/release 构建。真实设备 OAuth 与订阅调用仍待验证，非正式 Provider。
          令牌仅存内存，关闭验证页后需重新登录。
          源码：35906bc16f81008e71405935c75b6fb26ce7dac0
          构建：https://github.com/RT-C-6668882025/WE/actions/runs/40693423075
          NOTES
          gh release create v0.1.0-subscription-probe \
            apk/Moling-Subscription-Probe-v0.1.0.apk apk/SHA256SUMS.txt \
            --target 35906bc16f81008e71405935c75b6fb26ce7dac0 \
            --prerelease --title "Moling 订阅验证 v0.1.0" --notes-file release-notes.md
