name: Release subscription probe APK
on:
  workflow_dispatch:
  push:
    branches: ["probe/subscription-native"]
    paths: [".github/workflows/release-subscription-probe.yml"]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait for exact source build and download APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            RUN_ID=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=20" --jq '.workflow_runs[] | select(.path == ".github/workflows/subscription-probe.yml" and .event == "push") | .id' | head -n 1)
            if test -n "$RUN_ID"; then break; fi
            sleep 5
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --exit-status
          test "$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .head_sha)" = "$GITHUB_SHA"
          gh run download "$RUN_ID" --name moling-subscription-probe-debug --dir apk
          test -f apk/app-debug.apk
          mv apk/app-debug.apk apk/Moling-AI-Paper-v0.2.3.apk
          cd apk
          sha256sum Moling-AI-Paper-v0.2.3.apk > SHA256SUMS.txt
      - name: Publish diagnostics prerelease
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          墨灵 AI Paper v0.2.3：修复集成版授权状态与页面生命周期回归。
          授权任务由应用持有，浏览器切换/页面销毁不再自动取消。保留完整身份校验。
          登录和模型列表分开执行；先看到登录通过，再点击刷新模型列表并启用模型。
          恢复分阶段网络诊断。模型列表失败会单独报告，不再把已完成的登录标成失败。
          增加显式取消按钮，令牌仍只在内存。进程被系统终止后仍需重新登录。
          PDF 和原 API 沿用上一版本。独立包名可与旧版共存。真实设备恢复情况待确认。
          NOTES
          printf '\nSource: %s\n' "$GITHUB_SHA" >> release-notes.md
          gh release create v0.2.3-ai-paper \
            apk/Moling-AI-Paper-v0.2.3.apk apk/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --title "Moling AI Paper v0.2.3" --notes-file release-notes.md
