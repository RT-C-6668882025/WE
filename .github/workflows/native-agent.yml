name: Android native agent
on:
  push:
    branches: ["feat/android-native-agent"]
  pull_request:
    paths: ["app/**", ".github/workflows/native-agent.yml"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, app and device test builds
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest --no-daemon
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run the complete agent contract inside Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.opc.baize.agent.NativeAgentDeviceTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: we-native-agent-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.*
            app/build/outputs/androidTest-results/
      - uses: actions/upload-artifact@v4
        with:
          name: we-android-native-agent-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
