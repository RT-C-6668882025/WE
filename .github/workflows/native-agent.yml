name: Android native agent
on:
  push:
    branches: ["main", "feat/android-native-agent", "feat/continuous-learning-paper"]
  workflow_dispatch:
  pull_request:
    paths: ["app/**", "mcp/**", ".github/workflows/native-agent.yml"]
concurrency:
  group: we-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Cancel superseded native builds
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          gh api "repos/$GH_REPO/actions/runs?branch=$GH_BRANCH&per_page=40" \
            --jq '.workflow_runs[] | select(.path == ".github/workflows/native-agent.yml" and .head_sha != "${{ github.sha }}" and (.status == "queued" or .status == "in_progress")) | .id' |
          while read -r obsolete_run; do
            gh api --method POST "repos/$GH_REPO/actions/runs/$obsolete_run/cancel" || true
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973 cmake;3.22.1"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned Drawpile and Zstandard native sources
        run: bash tools/fetch-native-sources.sh
      - name: Verify the native drawing contract
        run: |
          cmake -S app/src/main/cpp -B build/drawing-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/drawing-native --parallel 2
          ctest --test-dir build/drawing-native --output-on-failure
      - name: Verify the paired MCP relay
        run: node --test mcp/relay.test.mjs
      - name: Unit tests, lint, app and device test builds
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest --no-daemon
      - name: Probe configured WE public relay
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://we.wordrelay.dpdns.org/health', {signal: AbortSignal.timeout(15000)});
          if (!response.ok) throw new Error(`WE relay health HTTP ${response.status}`);
          const h = await response.json();
          console.log(JSON.stringify({name:h.name, protocol:h.protocol, persistent:h.persistent}));
          if (h.name !== 'write-everything' || h.protocol !== 2 || h.persistent !== true) throw new Error('Incompatible WE relay');
          JS
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run the complete agent contract inside Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.opc.baize.agent.NativeAgentDeviceTest,com.opc.baize.mcp.McpDeviceTest,com.opc.baize.paper.DrawingDeviceTest --no-daemon
            bash tools/check-persistent-session-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: we-native-agent-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.*
            app/build/outputs/androidTest-results/
      - uses: actions/upload-artifact@v4
        with:
          name: we-android-native-agent-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: android
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the tested APK from this exact run
        run: |
          gh run download "$GITHUB_RUN_ID" --name we-android-native-agent-apk --dir apk
          mv apk/app-debug.apk apk/WE-v0.6.2-preview.apk
          cd apk
          sha256sum WE-v0.6.2-preview.apk > SHA256SUMS.txt
      - name: Publish WE preview
        run: |
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release create v0.6.2-we-preview apk/WE-v0.6.2-preview.apk apk/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --title "WE v0.6.2 Preview" --notes-file docs/releases/v0.6.2.md
