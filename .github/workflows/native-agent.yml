name: Android native agent
on:
  push:
    branches: ["main", "feat/android-native-agent", "feat/continuous-learning-paper"]
  workflow_dispatch:
  pull_request:
    paths: ["app/**", "mcp/**", ".github/workflows/native-agent.yml"]
permissions:
  contents: read
  actions: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Cancel superseded native builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/android-native-agent'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/runs?branch=feat/android-native-agent&per_page=40" \
            --jq '.workflow_runs[] | select(.path == ".github/workflows/native-agent.yml" and .head_sha != "${{ github.sha }}" and (.status == "queued" or .status == "in_progress")) | .id' |
          while read -r obsolete_run; do
            gh api --method POST "repos/$GH_REPO/actions/runs/$obsolete_run/cancel" || true
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the paired MCP relay
        run: node --test mcp/relay.test.mjs
      - name: Unit tests, lint, app and device test builds
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest --no-daemon
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run the complete agent contract inside Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.opc.baize.agent.NativeAgentDeviceTest,com.opc.baize.mcp.McpDeviceTest --no-daemon
            bash tools/check-persistent-session-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: we-native-agent-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.*
            app/build/outputs/androidTest-results/
      - uses: actions/upload-artifact@v4
        with:
          name: we-android-native-agent-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: android
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the tested APK from this exact run
        run: |
          gh run download "$GITHUB_RUN_ID" --name we-android-native-agent-apk --dir apk
          mv apk/app-debug.apk apk/WE-v0.4.6-preview.apk
          cd apk
          sha256sum WE-v0.4.6-preview.apk > SHA256SUMS.txt
      - name: Publish WE preview
        run: |
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release create v0.4.6-we-preview apk/WE-v0.4.6-preview.apk apk/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --title "WE v0.4.6 Preview" --notes-file docs/releases/v0.4.6.md
