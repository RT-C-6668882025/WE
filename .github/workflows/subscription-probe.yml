name: Subscription probe
on:
  workflow_dispatch:
  push:
    branches: ["probe/subscription-native"]
  pull_request:
    paths:
      - "app/src/debug/**"
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - "app/src/testDebug/java/com/opc/baize/subscription/**"
      - ".github/workflows/subscription-probe.yml"
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscription-probe-results
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v4
        with:
          name: moling-subscription-probe-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  persistent-session-device:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build matching app and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tools/check-persistent-session-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistent-session-device-results
          path: session-device-results/
