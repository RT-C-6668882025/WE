name: Subscription probe
on:
  workflow_dispatch:
  push:
    branches: ["probe/subscription-native"]
  pull_request:
    paths:
      - "app/src/debug/**"
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - "app/src/testDebug/java/com/opc/baize/subscription/**"
      - ".github/workflows/subscription-probe.yml"
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscription-probe-results
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v4
        with:
          name: moling-subscription-probe-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
