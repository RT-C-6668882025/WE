name: Skill MCP bridge
on:
  push:
    branches: ["feat/skill-mcp-subscription-bridge"]
  pull_request:
    paths:
      - "app/**"
      - "tools/agent-engine/**"
      - "tools/check-agent-bridge.sh"
      - ".github/workflows/agent-bridge.yml"
permissions:
  contents: read
jobs:
  engine-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/agent-engine/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tools/agent-engine
      - name: Fetch the same HTTP and JSON test dependencies as Gradle
        run: |
          mkdir -p "$RUNNER_TEMP/bridge-jars"
          curl -fsSL https://repo.maven.apache.org/maven2/org/nanohttpd/nanohttpd/2.3.1/nanohttpd-2.3.1.jar -o "$RUNNER_TEMP/bridge-jars/nanohttpd.jar"
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$RUNNER_TEMP/bridge-jars/json.jar"
      - run: bash tools/check-agent-bridge.sh
        env:
          WE_BRIDGE_TEST_JARS: ${{ runner.temp }}/bridge-jars
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: we-agent-bridge-checks
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v4
        with:
          name: we-agent-bridge-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
